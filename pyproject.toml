[project]
name = "mergeproof"
version = "0.1.0"
description = "Bob-native pre-merge evidence verification workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
mergeproof = "mergeproof.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

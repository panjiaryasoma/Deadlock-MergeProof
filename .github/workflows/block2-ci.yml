name: MergeProof CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.10,<1"

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check src tests scripts demo

      - name: Verify installed CLI
        run: uv run mergeproof --help

      - name: Run seeded demo application
        run: uv run python -m demo.app

      - name: Run seeded demo tests
        run: uv run python -m unittest discover -s demo/tests -t . -v

      - name: Prepare isolated Bob demo workspace
        run: uv run python scripts/prepare_demo_workspace.py

      - name: Regenerate schema
        run: uv run python scripts/generate_schema.py

      - name: Verify schema artifact is clean
        run: git diff --exit-code -- schemas/mergeproof_report.schema.json

      - name: Run schema drift guard
        run: uv run pytest -q tests/test_schema_artifact.py
